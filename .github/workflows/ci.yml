name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality and build / Qualidade e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run db:validate
      - run: npm run build
  database:
    name: PostgreSQL migrations and integrity / Migrations e integridade PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: barberflow
          POSTGRES_PASSWORD: barberflow_ci_example
          POSTGRES_DB: barberflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barberflow -d barberflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://barberflow:barberflow_ci_example@localhost:5432/barberflow_ci?schema=public
      TEST_DATABASE_URL: postgresql://barberflow:barberflow_ci_example@localhost:5432/barberflow_schema_test?schema=public
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:migrate:status
      - run: npm run db:drift
      - run: npm run db:check
      - name: Create isolated test database / Criar banco de testes isolado
        run: docker exec "${{ job.services.postgres.id }}" createdb -U barberflow barberflow_schema_test
      - run: npm run db:test
